<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw Control Center</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 200px;
      min-width: 200px;
      background: #161616;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      padding: 16px 0;
    }

    #sidebar .logo {
      font-size: 14px;
      font-weight: 700;
      color: #4da6ff;
      padding: 0 16px 20px;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 12px;
    }

    #sidebar .logo span {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #666;
      margin-top: 2px;
    }

    .tab-btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      border-left: 3px solid transparent;
    }

    .tab-btn:hover {
      color: #e0e0e0;
      background: #1e1e1e;
    }

    .tab-btn.active {
      color: #4da6ff;
      background: #1a1a2e;
      border-left-color: #4da6ff;
    }

    /* ── Content ── */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }

    #content h1 {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 24px;
    }

    #content h2 {
      font-size: 14px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 24px 0 12px;
    }

    #content h2:first-child { margin-top: 0; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-green { background: #0d3a1e; color: #3ddc84; }
    .badge-yellow { background: #3a2e0d; color: #f0c040; }
    .badge-red { background: #3a0d0d; color: #f04040; }
    .badge-blue { background: #0d1e3a; color: #4da6ff; }
    .badge-gray { background: #1e1e1e; color: #888; }
    .badge-done { background: #1e1e1e; color: #888; }

    /* ── Cards ── */
    .card {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .metric {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 8px;
      padding: 16px;
    }

    .metric .value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }

    .metric .label {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    /* ── List items ── */
    .list-item {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .list-item .name {
      font-size: 13px;
      color: #e0e0e0;
    }

    .list-item .sub {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .agent-card {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-card .name {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
      flex: 1;
    }

    .agent-card .model {
      font-size: 11px;
      color: #666;
    }

    .agent-card .sessions {
      font-size: 11px;
      color: #555;
    }

    .doc-item {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 10px 16px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #e0e0e0;
    }

    .empty {
      color: #555;
      font-size: 13px;
      padding: 16px 0;
    }

    .loading {
      color: #555;
      font-size: 13px;
      padding: 16px 0;
    }

    .error-msg {
      color: #f04040;
      font-size: 13px;
      padding: 16px 0;
    }

    .last-updated {
      font-size: 11px;
      color: #444;
      margin-top: 20px;
    }

    /* ── Divider ── */
    hr {
      border: none;
      border-top: 1px solid #252525;
      margin: 20px 0;
    }

    /* 设置 specific */
    .settings-row {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .settings-row .label {
      font-size: 13px;
      color: #e0e0e0;
    }

    .settings-row .desc {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .exception-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .exception-pill {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
    }

    .exception-pill .count {
      font-size: 24px;
      font-weight: 700;
    }

    .exception-pill .label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .exception-pill.critical .count { color: #f04040; }
    .exception-pill.high .count { color: #f08040; }
    .exception-pill.medium .count { color: #f0c040; }
    .exception-pill.low .count { color: #4da6ff; }

    /* ── 项目 ── */
    .projects-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .project-card {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .project-card:hover { border-color: #4da6ff; }
    .project-card.expanded { border-color: #4da6ff; background: #1a1a2e; }
    .project-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .project-card-name {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
      flex: 1;
    }
    .project-card-meta {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    .project-summary {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #252525;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .project-summary-metric {
      text-align: center;
      background: #111;
      border-radius: 6px;
      padding: 8px;
    }
    .project-summary-metric .value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .project-summary-metric .label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #1a3a6e;
      color: #4da6ff;
      border-color: #4da6ff;
    }
    .btn-primary:hover { background: #1a4a8a; }
    .btn-ghost {
      background: transparent;
      color: #888;
      border-color: #2a2a2a;
    }
    .btn-ghost:hover { background: #1e1e1e; color: #e0e0e0; }
    .btn-danger {
      background: #3a0d0d;
      color: #f04040;
      border-color: #f04040;
    }
    .btn-danger:hover { background: #4a1515; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 24px;
      width: 420px;
      max-width: 90vw;
    }
    .modal h2 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 20px;
    }
    .modal-field {
      margin-bottom: 14px;
    }
    .modal-field label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .modal-field input,
    .modal-field textarea {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      resize: vertical;
    }
    .modal-field input:focus,
    .modal-field textarea:focus {
      outline: none;
      border-color: #4da6ff;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* ── 任务 ── */
    .task-item {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .task-item .task-title {
      font-size: 13px;
      color: #e0e0e0;
      font-weight: 600;
    }
    .task-item .task-meta {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    /* ── 异常中心 ── */
    .exc-item {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .exc-item .exc-type {
      font-size: 13px;
      color: #e0e0e0;
      font-weight: 600;
    }
    .exc-item .exc-msg {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    /* ── 文档 two-column ── */
    .docs-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      height: calc(100vh - 120px);
    }
    .docs-list {
      overflow-y: auto;
    }
    .doc-entry {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .doc-entry:hover { border-color: #4da6ff; }
    .doc-entry.active { border-color: #4da6ff; background: #1a1a2e; }
    .doc-entry .doc-name {
      font-size: 13px;
      color: #e0e0e0;
    }
    .doc-entry .doc-meta {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }
    .docs-preview {
      display: flex;
      flex-direction: column;
    }
    .docs-preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .docs-preview-title {
      font-size: 13px;
      color: #888;
    }
    .doc-textarea {
      flex: 1;
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 12px;
      padding: 14px;
      resize: none;
      min-height: 300px;
    }
    .docs-api-hint {
      margin-top: 8px;
      font-size: 11px;
      color: #444;
      font-family: monospace;
    }

    /* ── 记忆 two-column ── */
    .memory-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      height: calc(100vh - 120px);
    }
    .memory-list {
      overflow-y: auto;
    }
    .mem-entry {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .mem-entry:hover { border-color: #4da6ff; }
    .mem-entry.active { border-color: #4da6ff; background: #1a1a2e; }
    .mem-entry .mem-agent {
      font-size: 13px;
      color: #e0e0e0;
    }
    .mem-entry .mem-status {
      font-size: 11px;
      margin-top: 2px;
    }
    .memory-preview {
      display: flex;
      flex-direction: column;
    }
    .memory-preview-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }
    .memory-textarea {
      flex: 1;
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 12px;
      padding: 14px;
      resize: none;
      min-height: 200px;
    }
    .memory-empty {
      color: #555;
      font-size: 13px;
      padding: 32px 0;
      text-align: center;
    }
    /* ── Approvals ── */
    .approval-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .approval-tab-btn {
      padding: 6px 16px;
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      color: #888;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .approval-tab-btn:hover { color: #e0e0e0; border-color: #4da6ff; }
    .approval-tab-btn.active {
      background: #1a3a6e;
      border-color: #4da6ff;
      color: #4da6ff;
    }
    .approval-tab-btn .count {
      display: inline-block;
      background: #f04040;
      color: #fff;
      border-radius: 10px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }
    .approval-tab-btn.active .count { background: #fff; color: #1a3a6e; }

    .approval-item {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .approval-item:hover { border-color: #4da6ff; }
    .approval-item.expanded { border-color: #4da6ff; background: #1a1a2e; }

    .approval-item-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .approval-item-title {
      font-size: 13px;
      color: #e0e0e0;
      font-weight: 600;
      flex: 1;
    }
    .approval-item-meta {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    .approval-detail {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #252525;
    }
    .approval-detail-field {
      margin-bottom: 10px;
    }
    .approval-detail-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .approval-detail-value {
      font-size: 13px;
      color: #e0e0e0;
    }
    .approval-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .approval-comment-field {
      margin-top: 12px;
    }
    .approval-comment-input {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      resize: vertical;
      min-height: 60px;
    }
    .approval-comment-input:focus { outline: none; border-color: #4da6ff; }
    .btn-approve {
      background: #0d3a1e;
      color: #3ddc84;
      border-color: #3ddc84;
    }
    .btn-approve:hover { background: #145a2e; }
    .btn-reject {
      background: #3a0d0d;
      color: #f04040;
      border-color: #f04040;
    }
    .btn-reject:hover { background: #4a1515; }

    .history-item {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .history-item-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .history-item-title {
      font-size: 13px;
      color: #e0e0e0;
      font-weight: 600;
      flex: 1;
    }
    .history-item-meta {
      font-size: 11px;
      color: #666;
    }

    /* riskLevel badge colors */
    .badge-critical { background: #3a0d0d; color: #f04040; }
    .badge-high { background: #3a2a0d; color: #f08040; }
    .badge-medium { background: #3a2e0d; color: #f0c040; }
    .badge-low { background: #0d3a1e; color: #3ddc84; }
    .badge-purple { background: #2a0d3a; color: #c080f0; }

    /* ── Timeline ── */
    .timeline-item {
      background: #181818;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .timeline-item-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .timeline-agent {
      font-size: 12px;
      color: #888;
      font-weight: 600;
    }
    .timeline-ts {
      font-size: 11px;
      color: #555;
      margin-left: auto;
    }
    .timeline-summary {
      font-size: 13px;
      color: #e0e0e0;
      margin-bottom: 4px;
    }
    .timeline-target {
      font-size: 11px;
      color: #555;
    }
    .timeline-diff {
      margin-top: 6px;
      font-size: 11px;
      color: #555;
      font-family: monospace;
      word-break: break-all;
    }
    .tl-label {
      color: #888;
      margin-right: 4px;
    }

    .health-ok {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3ddc84;
      font-size: 13px;
      padding: 16px 0;
    }
    .health-ok .check {
      font-size: 18px;
    }

    /* ── Live Sessions ── */
    .sessions-layout {
      display: flex;
      height: calc(100vh - 0px);
      overflow: hidden;
      margin: -32px;
    }
    .sessions-fleet {
      width: 320px;
      flex-shrink: 0;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #111;
    }
    .sessions-inspector {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sf-header {
      padding: 10px 12px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #141414;
      flex-shrink: 0;
    }
    .sf-title { font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px; flex: 1; }
    .sse-dot { width: 7px; height: 7px; border-radius: 50%; background: #444; flex-shrink: 0; }
    .sse-dot.connected { background: #4caf50; }
    .sf-filter-bar {
      display: flex; gap: 4px; padding: 8px 10px;
      border-bottom: 1px solid #1e1e1e; flex-shrink: 0;
    }
    .sf-filter {
      padding: 2px 8px; border: 1px solid #2a2a2a; border-radius: 3px;
      background: none; color: #666; font-size: 11px; cursor: pointer; font-family: inherit;
    }
    .sf-filter.active { background: #1e2c3d; border-color: #4da6ff; color: #4da6ff; }
    .sf-scroll { overflow-y: auto; flex: 1; }
    .agent-group { border-bottom: 1px solid #1a1a1a; }
    .agent-group-hdr {
      padding: 7px 12px; background: #141414;
      display: flex; align-items: center; gap: 7px;
    }
    .ag-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .ag-dot.busy { background: #4da6ff; }
    .ag-dot.idle { background: #3a3a3a; }
    .ag-name { font-size: 12px; font-weight: 600; color: #bbb; flex: 1; }
    .ag-count { font-size: 11px; color: #555; }
    .sess-row {
      padding: 6px 12px 6px 26px; display: flex; align-items: center; gap: 6px;
      cursor: pointer; border-bottom: 1px solid #181818; transition: background 0.1s;
    }
    .sess-row:hover { background: #1a1a1a; }
    .sess-row.selected { background: #1b2a3d; }
    .sess-id { font-size: 10px; color: #444; font-family: monospace; width: 70px; flex-shrink: 0; overflow: hidden; }
    .sess-task { flex: 1; font-size: 12px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sess-age { font-size: 10px; color: #555; flex-shrink: 0; }
    .sess-badge { font-size: 10px; padding: 1px 5px; border-radius: 2px; flex-shrink: 0; }
    .badge-active { background: #162616; color: #4caf50; }
    .badge-stalled { background: #2e2a14; color: #ffa726; }
    .badge-error { background: #2a1414; color: #ef5350; }
    /* Inspector */
    .si-hdr {
      padding: 10px 14px; border-bottom: 1px solid #2a2a2a;
      background: #141414; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .si-sid { font-family: monospace; font-size: 11px; color: #666; }
    .si-agent { padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 600; background: #1e2c3d; color: #4da6ff; }
    .si-live { padding: 2px 6px; border-radius: 3px; font-size: 10px; background: #162616; color: #4caf50; margin-left: auto; }
    .si-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #3a3a3a; font-size: 13px; }
    .si-scroll { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
    .ev-msg { padding: 7px 9px; border-radius: 4px; }
    .ev-msg.user { background: #1c1c1c; border-left: 2px solid #444; }
    .ev-msg.assistant { background: #151e2d; border-left: 2px solid #4da6ff; }
    .ev-role { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: #555; margin-bottom: 3px; }
    .ev-msg.assistant .ev-role { color: #4da6ff; }
    .ev-text { font-size: 12px; color: #ccc; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .ev-tool { padding: 5px 9px; font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; }
    .ev-tool-name { font-family: monospace; color: #9b8fe8; font-weight: 600; }
    .ev-tool-target { color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .ev-tool-ok { color: #4caf50; flex-shrink: 0; }
    .ev-tool-err { color: #ef5350; flex-shrink: 0; }
    .ev-ts { font-size: 10px; color: #3a3a3a; margin-bottom: 2px; }
    .si-stalled { padding: 7px 10px; background: #2a2514; border: 1px solid #4a4020; border-radius: 3px; font-size: 11px; color: #ffa726; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="logo">
    OpenClaw
    <span>Control Center</span>
  </div>
  <button class="tab-btn active" data-tab="overview">总览</button>
  <button class="tab-btn" data-tab="agents">智能体</button>
  <button class="tab-btn" data-tab="tasks">任务</button>
  <button class="tab-btn" data-tab="projects">项目</button>
  <button class="tab-btn" data-tab="exceptions">异常中心</button>
  <button class="tab-btn" data-tab="documents">文档</button>
  <button class="tab-btn" data-tab="memory">记忆</button>
  <button class="tab-btn" data-tab="settings">设置</button>
  <button class="tab-btn" data-tab="approvals">审批</button>
  <button class="tab-btn" data-tab="timeline">Timeline</button>
  <button class="tab-btn" data-tab="sessions">实时会话</button>
  <button class="tab-btn" data-tab="usage">账单</button>
  <button class="tab-btn" data-tab="hall">协作图</button>
</div>

<!-- Content -->
<div id="content">
  <!-- Panels injected here -->
</div>

<script>
  // ── Helpers ──────────────────────────────────────────────────
  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // ── Panel Content Templates ──────────────────────────────────

  const panels = {
    sessions: `
      <div class="sessions-layout">
        <div class="sessions-fleet">
          <div class="sf-header">
            <span class="sf-title">实时会话</span>
            <div class="sse-dot" id="sse-dot"></div>
          </div>
          <div class="sf-filter-bar">
            <button class="sf-filter active" data-filter="all">全部</button>
            <button class="sf-filter" data-filter="active">活跃</button>
            <button class="sf-filter" data-filter="stalled">停滞</button>
          </div>
          <div class="sf-scroll" id="fleet-scroll"></div>
        </div>
        <div class="sessions-inspector" id="session-inspector">
          <div class="si-empty">选择一个会话查看详情</div>
        </div>
      </div>
    `,
    tasks: `
      <h1>任务</h1>
      <div id="tasks-container">
        <div class="loading">Loading tasks...</div>
      </div>
    `,
    projects: `
      <h1>项目</h1>
      <div id="projects-toolbar" class="projects-toolbar">
        <span style="font-size:13px;color:#555;">点击项目查看 summary</span>
        <button class="btn btn-primary" id="btn-new-project">+ 新建项目</button>
      </div>
      <div id="projects-list">
        <div class="loading">Loading projects...</div>
      </div>
    `,
    exceptions: `
      <h1>异常中心</h1>
      <div id="exceptions-container">
        <div class="loading">Loading exceptions...</div>
      </div>
    `,
    documents: `
      <h1>文档</h1>
      <div id="docs-container">
        <div class="loading">Loading documents...</div>
      </div>
    `,
    memory: `
      <h1>记忆</h1>
      <div id="memory-container">
        <div class="loading">Loading memory...</div>
      </div>
    `,
    approvals: `
      <h1>审批</h1>
      <div id="approvals-tabs" class="approval-tabs">
        <button class="approval-tab-btn active" id="tab-pending">
          待审批<span class="count" id="pending-count">0</span>
        </button>
        <button class="approval-tab-btn" id="tab-history">历史记录</button>
      </div>
      <div id="approvals-body">
        <div class="loading">Loading approvals...</div>
      </div>
    `,
    timeline: `
      <h1>Timeline</h1>
      <div id="timeline-filters" style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <select id="tl-filter-agent" style="background:#181818;border:1px solid #2a2a2a;border-radius:6px;color:#e0e0e0;font-family:inherit;font-size:13px;padding:6px 10px;">
          <option value="">全部 Agent</option>
          <option value="main">main</option>
          <option value="forge">forge</option>
          <option value="reviewer">reviewer</option>
          <option value="sentinel">sentinel</option>
          <option value="system">system</option>
        </select>
        <select id="tl-filter-type" style="background:#181818;border:1px solid #2a2a2a;border-radius:6px;color:#e0e0e0;font-family:inherit;font-size:13px;padding:6px 10px;">
          <option value="">全部类型</option>
          <option value="task_create">task_create</option>
          <option value="task_update">task_update</option>
          <option value="project_create">project_create</option>
          <option value="project_archive">project_archive</option>
          <option value="doc_write">doc_write</option>
          <option value="memory_write">memory_write</option>
          <option value="approval_action">approval_action</option>
          <option value="exception_ack">exception_ack</option>
        </select>
        <button class="btn btn-ghost" id="tl-refresh" style="padding:6px 12px;">刷新</button>
        <a href="/api/export/timeline.csv" download style="margin-left:auto;padding:6px 12px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:6px;color:#888;font-size:13px;text-decoration:none;cursor:pointer;">导出 CSV</a>
      </div>
      <div id="timeline-body">
        <div class="loading">Loading timeline...</div>
      </div>
    `,

    usage: `
      <h1>账单</h1>
      <div id="usage-container">
        <div class="loading">Loading usage...</div>
      </div>
    `,

    hall: `
      <h1>协作图</h1>
      <div id="hall-container">
        <div class="loading">Loading hall...</div>
      </div>
    `
  };

  // ── Tab Switching ─────────────────────────────────────────────
  const content = document.getElementById('content');
  const buttons = document.querySelectorAll('.tab-btn');

  function showPanel(tab) {
    content.innerHTML = panels[tab] || '<div class="empty">Panel content goes here</div>';
    buttons.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => showPanel(btn.dataset.tab));
  });

  // Default: 总览
  showPanel('overview');

  // ── 总览 Panel ──────────────────────────────────────────
  async function loadOverview() {
    const panel = document.getElementById('panel-overview');
    if (!panel) return;
    panel.innerHTML = '<div class="loading">Loading overview...</div>';

    try {
      const snap = await fetchJSON('/api/overview/snapshot');

      const gw = snap.gateway || {};
      const version = gw.version || 'unknown';
      const uptime = gw.uptime ? formatUptime(gw.uptime) : null;
      const gw状态 = gw.status || 'unknown';
      const gwBadgeClass = gw状态 === 'healthy' ? 'badge-green' : 'badge-yellow';
      const gwBadgeText = gw状态.charAt(0).toUpperCase() + gw状态.slice(1);

      const agents = snap.agents || [];
      const busyAgents = agents.filter(a => a.status === 'busy').length;
      const totalAgents = agents.length;

      const cronJobs = snap.cron?.jobs || [];
      const cronOk = cronJobs.filter(j => j.status === 'ok').length;
      const cronError = cronJobs.filter(j => j.status === 'error').length;

      const exc = snap.exceptions || {};
      const lastUpdated = snap.generatedAt ? new Date(snap.generatedAt).toLocaleString() : '—';

      panel.innerHTML = `
        <h1>总览</h1>

        <h2>Gateway 状态</h2>
        <div class="metric-grid">
          <div class="metric">
            <div class="value">${version}</div>
            <div class="label">网关版本</div>
          </div>
          <div class="metric">
            <div class="value" style="font-size:18px;color:#3ddc84;">${uptime ? uptime : '—'}</div>
            <div class="label">Uptime</div>
          </div>
          <div class="metric">
            <div class="value" style="font-size:14px;"><span class="badge ${gwBadgeClass}">${gwBadgeText}</span></div>
            <div class="label">Health 状态</div>
          </div>
        </div>

        <h2>Active 智能体</h2>
        <div class="metric-grid">
          <div class="metric">
            <div class="value">${busyAgents}/${totalAgents}</div>
            <div class="label">忙碌 / Total</div>
          </div>
          <div class="metric">
            <div class="value">${totalAgents}</div>
            <div class="label">Total 智能体</div>
          </div>
          <div class="metric">
            <div class="value">${busyAgents}</div>
            <div class="label">Active Sessions</div>
          </div>
        </div>

        <h2>定时任务</h2>
        <div class="metric-grid">
          <div class="metric">
            <div class="value" style="color:#3ddc84;">${cronOk}</div>
            <div class="label">OK</div>
          </div>
          <div class="metric">
            <div class="value" style="color:#f04040;">${cronError}</div>
            <div class="label">Error</div>
          </div>
          <div class="metric">
            <div class="value">${cronJobs.length}</div>
            <div class="label">Total Jobs</div>
          </div>
        </div>

        <h2>异常中心 Summary</h2>
        <div class="exception-summary">
          <div class="exception-pill critical">
            <div class="count">${exc.critical || 0}</div>
            <div class="label">Critical</div>
          </div>
          <div class="exception-pill high">
            <div class="count">${exc.high || 0}</div>
            <div class="label">High</div>
          </div>
          <div class="exception-pill medium">
            <div class="count">${exc.medium || 0}</div>
            <div class="label">Medium</div>
          </div>
          <div class="exception-pill low">
            <div class="count">${exc.low || 0}</div>
            <div class="label">Low</div>
          </div>
        </div>

        <div class="last-updated">Last updated: ${lastUpdated}</div>
      `;
    } catch (err) {
      panel.innerHTML = `
        <h1>总览</h1>
        <div class="error-msg">加载失败: ${err.message}</div>
      `;
    }
  }

  // ── 智能体 Panel ──────────────────────────────────────────────
  async function loadAgents() {
    const panel = document.getElementById('panel-agents');
    if (!panel) return;
    panel.innerHTML = '<div class="loading">Loading agents...</div>';

    try {
      const agents = await fetchJSON('/api/agents');
      const total = agents.length;

      if (!agents.length) {
        panel.innerHTML = `
          <h1>智能体</h1>
          <div class="empty">No agents found</div>
        `;
        return;
      }

      const agentCards = agents.map(a => {
        const statusBadgeClass = a.status === 'busy' ? 'badge-yellow' : 'badge-green';
        const statusBadgeText = a.status === 'busy' ? 'busy' : 'idle';
        const model = a.model || '—';
        const sessions = a.activeSessionCount || 0;
        const name = a.displayName || a.agentId || 'Unknown';

        return `
          <div class="agent-card">
            <span class="name">${name}</span>
            <span class="sessions">${sessions} session${sessions !== 1 ? 's' : ''}</span>
            <span class="badge ${statusBadgeClass}">${statusBadgeText}</span>
            <span class="model">${model}</span>
          </div>
        `;
      }).join('');

      panel.innerHTML = `
        <h1>智能体 <span style="font-size:14px;color:#666;font-weight:400;">(${total})</span></h1>
        ${agentCards}
      `;
    } catch (err) {
      panel.innerHTML = `
        <h1>智能体</h1>
        <div class="error-msg">加载失败: ${err.message}</div>
      `;
    }
  }

  // ── 设置 Panel ────────────────────────────────────────────
  async function loadSettings() {
    const panel = document.getElementById('panel-settings');
    if (!panel) return;
    panel.innerHTML = '<div class="loading">Loading settings...</div>';

    try {
      const health = await fetchJSON('/api/settings/health');

      const gw = health.gateway || {};
      const version = gw.version || health.openclaw版本 || 'unknown';
      // Prefer health.channel (detailed probe), fall back to gateway.channel状态
      const channels = (health.channel && health.channel.length)
        ? health.channel
        : (gw.channel状态 || []);

      // Feishu channel
      const feishu频道 = channels.find(c =>
        (c.channel || '').toLowerCase().includes('feishu') ||
        (c.channel || '').toLowerCase().includes('lark')
      );
      const feishu状态 = feishu频道
        ? (feishu频道.status || '').toLowerCase()
        : 'unknown';
      const feishuBadgeClass =
        feishu状态.includes('run') || feishu状态.includes('ok') || feishu状态 === 'connected'
          ? 'badge-green'
          : feishu状态.includes('disconnect') || feishu状态.includes('error') || feishu状态 === 'disconnected'
            ? 'badge-red'
            : 'badge-yellow';
      const feishuDisplay = feishu频道 ? feishu频道.status : 'not found';

      // 模式 — from snapshot system object via the overview (snapshot itself is not
      // directly available here; default to readonly as per system defaults)
      const mode = (health.system && health.system.mode) || 'readonly';
      const modeBadgeClass = mode === 'writable' ? 'badge-green' : 'badge-yellow';

      // Security flags — from health.system.securityFlags, fallback to gw-level or empty
      const securityFlags = (health.system && health.system.securityFlags) || gw.securityFlags || [];
      const securityItems = securityFlags.length
        ? securityFlags.map(f => `<span class="badge badge-blue">${f}</span>`).join(' ')
        : '<span style="color:#555;">None</span>';

      // Budget
      const budget = health.budget;
      let budgetHTML = `<div class="settings-row"><div><div class="label">Token 用量</div><div class="desc">No usage data available</div></div><span class="badge badge-gray">N/A</span></div>`;
      if (budget) {
        const pct = budget.percentUsed || 0;
        const limit = budget.monthlyLimit || 1000000;
        const statusClass = budget.status === 'exceeded' ? 'badge-red' : budget.status === 'warning' ? 'badge-yellow' : 'badge-green';
        const statusLabel = budget.status === 'exceeded' ? 'EXCEEDED' : budget.status === 'warning' ? 'WARNING' : 'OK';
        const statusNote = budget.status === 'exceeded' ? 'Budget exceeded — please review usage'
          : budget.status === 'warning' ? `Approaching limit (warn at ${budget.warnAtPercent}%)`
          : `Within budget (warn at ${budget.warnAtPercent}%)`;
        const barWidth = Math.min(pct, 100);
        const barColor = budget.status === 'exceeded' ? '#f04040' : budget.status === 'warning' ? '#f0c040' : '#3ddc84';
        budgetHTML = `<div class="settings-row" style="flex-direction:column;align-items:stretch;gap:10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div class="label">Token 用量 <span style="font-size:11px;color:#666;">（本月）</span></div>
              <div class="desc">${budget.sessionCount || 0} sessions · input ${formatTokens(budget.inputTokens)} + output ${formatTokens(budget.outputTokens)}</div>
            </div>
            <span class="badge ${statusClass}">${statusLabel}</span>
          </div>
          <div style="background:#111;border-radius:4px;height:8px;overflow:hidden;"><div style="width:${barWidth}%;height:100%;background:${barColor};transition:width 0.3s;"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:#555;"><span>${formatTokens(budget.totalTokens || 0)} used</span><span>${formatTokens(limit)} limit</span><span>${pct}%</span></div>
          <div style="font-size:11px;color:${budget.status === 'exceeded' ? '#f04040' : budget.status === 'warning' ? '#f0c040' : '#555'};">${statusNote}</div>
        </div>`;
      }

      panel.innerHTML = `
        <h1>设置</h1>

        <h2>Gateway</h2>
        <div class="settings-row">
          <div>
            <div class="label">网关版本</div>
            <div class="desc">OpenClaw Gateway</div>
          </div>
          <span class="badge badge-blue">${version}</span>
        </div>
        <div class="settings-row">
          <div>
            <div class="label">Gateway 状态</div>
            <div class="desc">${gw.status || 'unknown'}</div>
          </div>
          <span class="badge ${gw.status === 'healthy' ? 'badge-green' : 'badge-yellow'}">${gw.status || 'unknown'}</span>
        </div>

        <h2>Token 用量</h2>
        ${budgetHTML}

        <h2>频道</h2>
        <div class="settings-row">
          <div>
            <div class="label">Feishu</div>
            <div class="desc">频道 connection status</div>
          </div>
          <span class="badge ${feishuBadgeClass}">${feishuDisplay}</span>
        </div>
        ${(gw.channel状态 || []).filter(c => !((c.channel || '').toLowerCase().includes('feishu'))).map(c => `
          <div class="settings-row">
            <div>
              <div class="label">${c.channel || 'Unknown'}</div>
              <div class="desc">频道 connection status</div>
            </div>
            <span class="badge badge-blue">${c.status || 'unknown'}</span>
          </div>
        `).join('')}

        <h2>模式</h2>
        <div class="settings-row">
          <div>
            <div class="label">Operation 模式</div>
            <div class="desc">${mode === 'writable' ? 'Read and write enabled' : 'Read-only — no write operations'}</div>
          </div>
          <span class="badge ${modeBadgeClass}">${mode}</span>
        </div>

        <h2>Security</h2>
        <div class="settings-row">
          <div>
            <div class="label">Security Flags</div>
            <div class="desc">Active security configurations</div>
          </div>
          <div style="text-align:right;">${securityItems}</div>
        </div>
      `;

      // ── Feishu 推送配置 ──────────────────────────────────────
      const notify = await fetchJSON('/api/settings/notify').catch(() => null);
      panel.innerHTML += `
        <h2>Feishu 推送</h2>
        <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div class="label">Webhook 推送</div>
              <div class="desc">审批操作自动推送至飞书群</div>
            </div>
            <span class="badge ${notify?.enabled ? 'badge-green' : 'badge-gray'}">${notify?.enabled ? 'ON' : 'OFF'}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <input id="notify-webhook" type="text" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/..."
              style="flex:1;min-width:0;background:#111;border:1px solid #2a2a2a;border-radius:6px;color:#e0e0e0;font-size:12px;padding:6px 10px;font-family:monospace;"
              value="${notify?.webhookSet ? '(已配置)' : ''}" />
            <select id="notify-level" style="background:#111;border:1px solid #2a2a2a;border-radius:6px;color:#e0e0e0;font-size:12px;padding:6px 8px;">
              <option value="critical" ${notify?.level === 'critical' ? 'selected' : ''}>仅 critical</option>
              <option value="all" ${notify?.level === 'all' ? 'selected' : ''}>全部</option>
            </select>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" id="btn-notify-save" style="font-size:12px;padding:5px 14px;">保存</button>
            <button class="btn btn-ghost" id="btn-notify-test" style="font-size:12px;padding:5px 14px;">测试发送</button>
            <button class="btn btn-ghost" id="btn-notify-toggle" style="font-size:12px;padding:5px 14px;">${notify?.enabled ? '禁用' : '启用'}</button>
            <span id="notify-msg" style="font-size:12px;color:#555;align-self:center;"></span>
          </div>
        </div>

        <h2>远程访问</h2>
        <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div class="label">Bearer Token 鉴权</div>

            <a href="/api/export/runtime" download class="btn btn-ghost" style="font-size:12px;padding:5px 14px;text-decoration:none;">导出 Runtime ZIP</a>

      document.getElementById('btn-notify-save')?.addEventListener('click', async () => {

        const level = document.getElementById('notify-level').value;
        const msg = document.getElementById('notify-msg');
        if (webhookUrl && !webhookUrl.startsWith('(')) {
          await fetch('/api/settings/notify', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ webhookUrl, level }) });
          msg.textContent = '已保存'; setTimeout(() => msg.textContent = '', 2000);
        } else {
          await fetch('/api/settings/notify', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level }) });
          msg.textContent = '级别已保存'; setTimeout(() => msg.textContent = '', 2000);
        }
      });
      document.getElementById('btn-notify-test')?.addEventListener('click', async () => {
        const msg = document.getElementById('notify-msg');
        const r = await fetch('/api/settings/notify/test', { method: 'POST' });
        const d = await r.json();
        msg.style.color = d.ok ? '#4caf50' : '#ef5350';
        msg.textContent = d.ok ? '发送成功' : (d.error || '发送失败');
        setTimeout(() => { msg.textContent = ''; msg.style.color = '#555'; }, 3000);
      });
      document.getElementById('btn-notify-toggle')?.addEventListener('click', async () => {
        const cur = notify?.enabled;
        await fetch('/api/settings/notify', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: !cur }) });
        loadSettings();
      });

      // Wire Access buttons
      const accessData = await fetchJSON('/api/settings/access').catch(() => ({ enabled: false, hasToken: false }));
      const badge = document.getElementById('access-badge');
      if (badge) { badge.textContent = accessData.enabled ? 'ON' : 'OFF'; badge.className = `badge ${accessData.enabled ? 'badge-green' : 'badge-gray'}`; }
      document.getElementById('btn-access-save')?.addEventListener('click', async () => {
        const token = document.getElementById('access-token').value;
        const msg = document.getElementById('access-msg');
        await fetch('/api/settings/access', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token || null }) });
        msg.textContent = token ? 'Token 已设置' : 'Token 已清除';
        document.getElementById('access-token').value = '';
        setTimeout(() => msg.textContent = '', 2000);
      });
      document.getElementById('btn-access-toggle')?.addEventListener('click', async () => {
        const d = await fetchJSON('/api/settings/access').catch(() => ({ enabled: false }));
        await fetch('/api/settings/access', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: !d.enabled }) });
        loadSettings();
      });

    } catch (err) {
      panel.innerHTML = `
        <h1>设置</h1>
        <div class="error-msg">加载失败: ${err.message}</div>

  // ── 异常中心 Panel ─────────────────────────────────────────
  async function loadExceptions() {
    const panel = document.getElementById('exceptions-container');
    if (!panel) return;
    panel.innerHTML = '<div class="loading">Loading exceptions...</div>';

    try {
      const exceptions = await fetchJSON('/api/exceptions');

      const sevClass = s => s === 'critical' ? 'badge-red' : s === 'high' ? 'badge-yellow' : s === 'medium' ? 'badge-yellow' : 'badge-blue';
      const statusClass = s => s === 'acknowledged' ? 'badge-gray' : s === 'snoozed' ? 'badge-blue' : '';

      const toolbar = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span style="font-size:12px;color:#555;">${exceptions.length} 条待处理异常</span>
          <label style="font-size:12px;color:#666;cursor:pointer;">
            <input type="checkbox" id="exc-show-acked" style="margin-right:4px;" />
            显示已确认
          </label>
        </div>`;

      if (!exceptions.length) {
        panel.innerHTML = toolbar + `<div class="health-ok"><span class="check">✓</span>无异常 — system is healthy</div>`;
        document.getElementById('exc-show-acked')?.addEventListener('change', async (ev) => {
          const url = ev.target.checked ? '/api/exceptions?includeAcked=1' : '/api/exceptions';
          const all = await fetchJSON(url).catch(() => []);
          renderExceptions(all, panel);
        });
        return;
      }

      panel.innerHTML = toolbar + exceptions.map(e => `
        <div class="exc-item" data-id="${escHtml(e.exceptionId)}" style="position:relative;">
          <div class="exc-type" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="badge ${sevClass(e.severity)}">${escHtml(e.severity)}</span>
            <span style="color:#888;font-size:11px;">${escHtml(e.type)}</span>
            <span style="color:#555;font-size:11px;">·</span>
            <span style="color:#555;font-size:11px;">${escHtml(e.source)}</span>
            ${e.actionStatus !== 'pending' ? `<span class="badge ${statusClass(e.actionStatus)}" style="margin-left:auto;">${e.actionStatus}</span>` : ''}
          </div>
          <div class="exc-msg">${escHtml(e.message)}</div>
          ${e.actionRequired ? `<div style="font-size:11px;color:#555;margin-top:4px;">→ ${escHtml(e.actionRequired)}</div>` : ''}
          <div style="margin-top:8px;display:flex;gap:6px;">
            <button class="btn btn-ghost exc-ack-btn" data-id="${escHtml(e.exceptionId)}" style="font-size:11px;padding:3px 10px;">确认</button>
          </div>
        </div>
      `).join('');

      // Ack buttons
      panel.querySelectorAll('.exc-ack-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch(`/api/action-queue/${encodeURIComponent(btn.dataset.id)}/ack`, { method: 'POST' });
          loadExceptions();
        });
      });

      document.getElementById('exc-show-acked')?.addEventListener('change', async (ev) => {
        const url = ev.target.checked ? '/api/exceptions?includeAcked=1' : '/api/exceptions';
        const all = await fetchJSON(url).catch(() => []);
        // re-render in place without full reload
        const rows = panel.querySelectorAll('.exc-item');
        rows.forEach(r => r.remove());
        all.forEach(e => {
          const d = document.createElement('div');
          d.className = 'exc-item';
          d.dataset.id = e.exceptionId;
          d.innerHTML = `
            <div class="exc-type" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span class="badge ${sevClass(e.severity)}">${escHtml(e.severity)}</span>
              <span style="color:#888;font-size:11px;">${escHtml(e.type)}</span>
              ${e.actionStatus !== 'pending' ? `<span class="badge ${statusClass(e.actionStatus)}" style="margin-left:auto;">${e.actionStatus}</span>` : ''}
            </div>
            <div class="exc-msg">${escHtml(e.message)}</div>
            ${e.actionRequired ? `<div style="font-size:11px;color:#555;margin-top:4px;">→ ${escHtml(e.actionRequired)}</div>` : ''}
            <div style="margin-top:8px;"><button class="btn btn-ghost exc-ack-btn" data-id="${escHtml(e.exceptionId)}" style="font-size:11px;padding:3px 10px;">确认</button></div>
          `;
          d.querySelector('.exc-ack-btn')?.addEventListener('click', async () => {
            await fetch(`/api/action-queue/${encodeURIComponent(e.exceptionId)}/ack`, { method: 'POST' });
            loadExceptions();
          });
          panel.appendChild(d);
        });
      });

    } catch (err) {
      panel.innerHTML = `<div class="error-msg">加载失败: ${err.message}</div>`;
    }
  }

  // ── 项目 Panel ──────────────────────────────────────────────
  async function loadProjects() {
    const panel = document.getElementById('projects-list');
    if (!panel) return;
    panel.innerHTML = '<div class="loading">Loading projects...</div>';

    // Bind new project button
    const toolbar = document.getElementById('projects-toolbar');
    if (toolbar) {
      const btn = document.getElementById('btn-new-project');
      if (btn) btn.onclick = () => showNewProjectModal();
    }

    try {
      const projects = await fetchJSON('/api/projects');

      if (!projects.length) {
        panel.innerHTML = '<div class="empty">暂无项目，点击右上角「新建项目」创建</div>';
        return;
      }

      const cards = projects.map(p => {
        const statusBadgeClass = getProjectStatusClass(p.status);
        const statusLabel = p.status || 'planning';
        const created = p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '—';
        return `
          <div class="project-card" data-id="${escHtml(p.projectId)}">
            <div class="project-card-header">
              <div class="project-card-name">${escHtml(p.name || 'Untitled')}</div>
              <span class="badge ${statusBadgeClass}">${escHtml(statusLabel)}</span>
            </div>
            <div class="project-card-meta">owner: ${escHtml(p.owner || '—')} &nbsp;·&nbsp; ${created}</div>
          </div>
        `;
      }).join('');

      panel.innerHTML = cards;

      // Bind click to expand
      panel.querySelectorAll('.project-card').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.dataset.id;
          // Toggle expand
          if (el.classList.contains('expanded') && el.querySelector('.project-summary')) {
            el.classList.remove('expanded');
            el.querySelector('.project-summary').remove();
            return;
          }
          // Remove other expanded
          panel.querySelectorAll('.project-card.expanded').forEach(other => {
            other.classList.remove('expanded');
            const s = other.querySelector('.project-summary');
            if (s) s.remove();
          });
          el.classList.add('expanded');

          // Load summary
          const summaryDiv = document.createElement('div');
          summaryDiv.className = 'project-summary';
          summaryDiv.innerHTML = `
            <div class="project-summary-metric"><div class="value">—</div><div class="label">Total</div></div>
            <div class="project-summary-metric"><div class="value">—</div><div class="label">Done</div></div>
            <div class="project-summary-metric"><div class="value">—</div><div class="label">In Progress</div></div>
            <div class="project-summary-metric"><div class="value">—</div><div class="label">Blocked</div></div>
          `;
          el.appendChild(summaryDiv);

          try {
            const sum = await fetchJSON('/api/projects/' + encodeURIComponent(id) + '/summary');
            summaryDiv.innerHTML = `
              <div class="project-summary-metric">
                <div class="value">${sum.taskCount ?? 0}</div>
                <div class="label">Total</div>
              </div>
              <div class="project-summary-metric">
                <div class="value" style="color:#3ddc84;">${sum.doneCount ?? 0}</div>
                <div class="label">Done</div>
              </div>
              <div class="project-summary-metric">
                <div class="value" style="color:#f0c040;">${sum.inProgressCount ?? 0}</div>
                <div class="label">In Progress</div>
              </div>
              <div class="project-summary-metric">
                <div class="value" style="color:#f04040;">${sum.blockedCount ?? 0}</div>
                <div class="label">Blocked</div>
              </div>
            `;
          } catch {
            summaryDiv.innerHTML = '<div class="empty" style="grid-column:1/-1;">加载 summary 失败</div>';
          }
        });
      });
    } catch (err) {
      panel.innerHTML = `<div class="error-msg">加载失败: ${err.message}</div>`;
    }
  }

  function getProjectStatusClass(status) {
    switch (status) {
      case 'planning': return 'badge-blue';
      case 'active': return 'badge-green';
      case 'paused': return 'badge-yellow';
      case 'done': return 'badge-gray';
      case 'cancelled': return 'badge-red';
      default: return 'badge-blue';
    }
  }

  // Status label styling for done=gray
  function getProjectStatusStyle(status) {
    if (status === 'done') return 'background:#1e1e1e;color:#888;';
    return '';
  }

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>新建项目</h2>
        <div class="modal-field">
          <label>项目名称 *</label>
          <input type="text" id="proj-name" placeholder="输入项目名称" autofocus />
        </div>
        <div class="modal-field">
          <label>项目描述</label>
          <textarea id="proj-summary" rows="3" placeholder="简要描述项目目标"></textarea>
        </div>
        <div class="modal-field">

          <input type="text" id="proj-owner" placeholder="main" />

  // ── Approvals Panel ─────────────────────────────────────────
  let currentApprovalView = 'pending'; // 'pending' or 'history'
  let expandedApprovalId = null;
  let pendingAction = null; // { approvalId, action: 'approve'|'reject' }

  async function loadApprovals() {
    const body = document.getElementById('approvals-body');
    if (!body) return;

    // Bind tab switching
    document.getElementById('tab-pending')?.addEventListener('click', () => {
      currentApprovalView = 'pending';
      document.getElementById('tab-pending')?.classList.add('active');
      document.getElementById('tab-history')?.classList.remove('active');
      loadApprovalsPending();
    });
    document.getElementById('tab-history')?.addEventListener('click', () => {
      currentApprovalView = 'history';
      document.getElementById('tab-pending')?.classList.remove('active');
      document.getElementById('tab-history')?.classList.add('active');
      loadApprovalsHistory();
    });

    if (currentApprovalView === 'history') {
      document.getElementById('tab-pending')?.classList.remove('active');
      document.getElementById('tab-history')?.classList.add('active');
      loadApprovalsHistory();
    } else {
      loadApprovalsPending();
    }
  }

  async function loadApprovalsPending() {
    const body = document.getElementById('approvals-body');
    if (!body) return;
    body.innerHTML = '<div class="loading">Loading approvals...</div>';

    try {
      const approvals = await fetchJSON('/api/approvals');
      const pending = approvals.filter(a => a.status === 'pending');

      // Update badge count
      const countEl = document.getElementById('pending-count');
      if (countEl) countEl.textContent = pending.length;

      if (!pending.length) {
        body.innerHTML = '<div class="empty">暂无待审批项</div>';
        return;
      }

      const items = pending.map(a => renderApprovalItem(a, false)).join('');
      body.innerHTML = items;

      // Bind expand
      body.querySelectorAll('.approval-item').forEach(el => {
        el.addEventListener('click', () => toggleApprovalExpand(el.dataset.id));

      e.stopPropagation();
      showCommentField(approvalId, 'approve');
    });

      e.stopPropagation();
      showCommentField(approvalId, 'reject');

  function showCommentField(approvalId, action) {
    const body = document.getElementById('approvals-body');
    if (!body) return;
    const field = document.getElementById('comment-field-' + approvalId);
    if (!field) return;

    field.style.display = 'block';
    pendingAction = { approvalId, action };

    // Change buttons to confirm
    const approveBtn = body.querySelector(`.btn-approve[data-id="${CSS.escape(approvalId)}"]`);
    const rejectBtn = body.querySelector(`.btn-reject[data-id="${CSS.escape(approvalId)}"]`);
    if (approveBtn) {
      approveBtn.textContent = '✓ Confirm Approve';
      approveBtn.onclick = e => {
        e.stopPropagation();
        submitApproval(approvalId, 'approve');
      };
    }
    if (rejectBtn) {
      rejectBtn.textContent = '✗ Confirm Reject';
      rejectBtn.onclick = e => {
        e.stopPropagation();
        submitApproval(approvalId, 'reject');
      };

  async function submitApproval(approvalId, action) {
    const body = document.getElementById('approvals-body');
    if (!body) return;
    const commentInput = document.getElementById('comment-input-' + approvalId);
    const comment = commentInput?.value || '';

    try {
      if (action === 'approve') {
        await fetch('/api/approvals/' + encodeURIComponent(approvalId) + '/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment }),
        });
      } else {
        await fetch('/api/approvals/' + encodeURIComponent(approvalId) + '/reject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment }),
        });
      }

      expandedApprovalId = null;
      pendingAction = null;
      // Switch to history view after action
      currentApprovalView = 'history';
      document.getElementById('tab-pending')?.classList.remove('active');
      document.getElementById('tab-history')?.classList.add('active');
      loadApprovalsHistory();
    } catch (err) {
      alert('操作失败: ' + err.message);
    }
  }

  async function loadApprovalsHistory() {
    const body = document.getElementById('approvals-body');
    if (!body) return;
    body.innerHTML = '<div class="loading">Loading history...</div>';

    try {
      const entries = await fetchJSON('/api/approval-actions');

      if (!entries.length) {
        body.innerHTML = '<div class="empty">暂无审批历史</div>';
        return;
      }

      // Sort by actedAt descending
      const sorted = [...entries].sort((a, b) => {
        const ta = a.actedAt ? new Date(a.actedAt).getTime() : 0;
        const tb = b.actedAt ? new Date(b.actedAt).getTime() : 0;
        return tb - ta;
      });

      const items = sorted.map(e => {
        const actionClass = e.action === 'approve' ? 'badge-green' : 'badge-red';
        const actionText = e.action === 'approve' ? 'Approved' : 'Rejected';
        const actedAt = e.actedAt ? new Date(e.actedAt).toLocaleString() : '—';
        return `
          <div class="history-item">
            <div class="history-item-header">
              <div class="history-item-title">${escHtml(e.approvalId || '—')}</div>
              <span class="badge ${actionClass}">${actionText}</span>

            <div class="history-item-meta">
              ${actedAt}${e.comment ? ' · ' + escHtml(e.comment) : ''}
            </div>

      }).join('');

      body.innerHTML = items;

      body.innerHTML = `<div class="error-msg">加载失败: ${err.message}</div>`;
    }

  // ── Utility ──────────────────────────────────────────────────
  function escHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function formatTokens(n) {
    if (!n && n !== 0) return '—';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return String(n);
  }

  function formatUptime(ms) {
    if (!ms) return null;
    const seconds = Math.floor(ms / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    if (days > 0) return `${days}d ${hours % 24}h`;
    if (hours > 0) return `${hours}h ${minutes % 60}m`;
    if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
    return `${seconds}s`;
  }

    };
    content.innerHTML = staticPanels[tab] || '<div class="empty">Panel content goes here</div>';
    buttons.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    // Trigger data load for dynamic panels
    if (tab === 'overview') loadOverview();
    else if (tab === 'agents') loadAgents();
    else if (tab === 'settings') loadSettings();
    else if (tab === 'tasks') loadTasks();
    else if (tab === 'exceptions') loadExceptions();
    else if (tab === 'documents') loadDocs();
    else if (tab === 'memory') load记忆();
    else if (tab === 'projects') loadProjects();
    else if (tab === 'approvals') loadApprovals();
    else if (tab === 'timeline') loadTimeline();
    else if (tab === 'sessions') loadSessions();
    else if (tab === 'usage') loadUsage();
    else if (tab === 'hall') loadHall();
  }

  // Patch button clicks to use new injection
  buttons.forEach(btn => {
    btn.addEventListener('click', () => injectPanelHTML(btn.dataset.tab));
  });

  // Load all panels in parallel on startup
  loadOverview();
  loadAgents();
  loadSettings();

  // Override showPanel so default tab works with dynamic injection
  // Patch the default showPanel call
  content.innerHTML = '<div id="panel-overview"></div>';
  loadOverview();

  // ── Live Sessions ─────────────────────────────────────────────

  let _sseConn = null;     // active EventSource
  let _sessions = [];      // from /api/sessions/list
  let _events = [];        // all events from SSE (fleet-wide)
  let _selectedSid = null; // currently selected sessionId
  let _filter = 'all';     // all | active | stalled
  const STALL_MS = 60_000;

  function loadSessions() {
    if (_sseConn) { _sseConn.close(); _sseConn = null; }
    _events = [];
    _sessions = [];
    _selectedSid = null;

    // Load session list, then open SSE
    fetch('/api/sessions/list').then(r => r.json()).then(data => {
      _sessions = data || [];
      _renderFleet();
    }).catch(() => {});

    _sseConn = new EventSource('/api/sessions/stream');
    _sseConn.onopen = () => {
      const dot = document.getElementById('sse-dot');
      if (dot) dot.classList.add('connected');
    };
    _sseConn.onerror = () => {
      const dot = document.getElementById('sse-dot');
      if (dot) dot.classList.remove('connected');
    };
    _sseConn.onmessage = (e) => {
      try {
        const ev = JSON.parse(e.data);
        _events.push(ev);
        if (_events.length > 1000) _events = _events.slice(-1000);

        // Update last-seen for this session
        const sess = _sessions.find(s => s.sessionId === ev.sessionId);
        if (sess) { sess._lastEventTs = Date.now(); }
        else {
          // New session seen via events — add placeholder
          _sessions.push({ sessionId: ev.sessionId, agentId: ev.agentId, _lastEventTs: Date.now(), ageMs: 0 });
        }

        _renderFleet();
        if (_selectedSid === ev.sessionId) _renderInspector(ev.sessionId);
      } catch {}
    };

    // Wire filter buttons
    document.querySelectorAll('.sf-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        _filter = btn.dataset.filter;
        document.querySelectorAll('.sf-filter').forEach(b => b.classList.toggle('active', b.dataset.filter === _filter));
        _renderFleet();
      });
    });
  }

  function _sessionStatus(sess) {
    const age = sess._lastEventTs ? Date.now() - sess._lastEventTs : null;
    if (age !== null && age > STALL_MS) return 'stalled';
    return 'active';
  }

  function _renderFleet() {
    const scroll = document.getElementById('fleet-scroll');
    if (!scroll) return;

    // Group by agentId
    const byAgent = {};
    for (const sess of _sessions) {
      const aid = sess.agentId || 'unknown';
      if (!byAgent[aid]) byAgent[aid] = [];
      byAgent[aid].push(sess);
    }

    // Filter
    const visibleSessions = _sessions.filter(s => {
      if (_filter === 'all') return true;
      return _sessionStatus(s) === _filter;
    });

    const agentOrder = ['main', 'forge', 'reviewer', 'sentinel'];
    const agentIds = [...new Set([...agentOrder, ...Object.keys(byAgent)])].filter(a => byAgent[a]);

    let html = '';
    for (const agentId of agentIds) {
      const agentSessions = (byAgent[agentId] || []).filter(s => visibleSessions.includes(s));
      const allAgentSessions = byAgent[agentId] || [];
      const isBusy = allAgentSessions.length > 0;

      html += `<div class="agent-group">
        <div class="agent-group-hdr">
          <div class="ag-dot ${isBusy ? 'busy' : 'idle'}"></div>
          <span class="ag-name">${agentId}</span>
          <span class="ag-count">${allAgentSessions.length} 个会话</span>
        </div>`;

      for (const sess of agentSessions) {
        const sid = sess.sessionId;
        const shortId = sid.slice(0, 8);
        const status = _sessionStatus(sess);
        const badgeClass = status === 'stalled' ? 'badge-stalled' : 'badge-active';
        const badgeText = status === 'stalled' ? '停滞' : '活跃';
        const ageMs = sess.ageMs || 0;
        const ageStr = ageMs > 0 ? _fmtAge(ageMs) : '—';
        // Last meaningful message as task hint
        const lastMsg = [..._events].reverse().find(e => e.sessionId === sid && e.type === 'message' && e.role === 'user');
        const hint = lastMsg ? lastMsg.text.slice(0, 60) : (sess.key || sid.slice(0, 16) + '...');
        const sel = _selectedSid === sid ? ' selected' : '';

        html += `<div class="sess-row${sel}" data-sid="${sid}">
          <span class="sess-id">${shortId}</span>
          <span class="sess-task">${_esc(hint)}</span>
          <span class="sess-age">${ageStr}</span>
          <span class="sess-badge ${badgeClass}">${badgeText}</span>
        </div>`;
      }
      html += '</div>';
    }

    if (!html) {
      html = '<div style="padding:20px;color:#444;font-size:12px;text-align:center">暂无活跃会话</div>';
    }

    scroll.innerHTML = html;

    // Bind click handlers
    scroll.querySelectorAll('.sess-row').forEach(row => {
      row.addEventListener('click', () => {
        _selectedSid = row.dataset.sid;
        _renderFleet();
        _renderInspector(_selectedSid);
      });
    });
  }

  function _renderInspector(sessionId) {
    const inspector = document.getElementById('session-inspector');
    if (!inspector) return;

    const sess = _sessions.find(s => s.sessionId === sessionId);
    const evs = _events.filter(e => e.sessionId === sessionId);
    const status = sess ? _sessionStatus(sess) : 'active';

    let html = `<div class="si-hdr">
      <span class="si-sid">${sessionId.slice(0, 18)}…</span>
      <span class="si-agent">${sess?.agentId || '?'}</span>
      <span class="si-live">● live</span>
    </div>
    <div class="si-scroll" id="si-scroll">`;

    if (status === 'stalled') {
      html += `<div class="si-stalled">⚠ 已停滞 — 超过 60 秒无新事件</div>`;
    }

    if (evs.length === 0) {
      html += `<div style="color:#444;font-size:12px;padding:12px">暂无事件记录</div>`;
    }

    for (const ev of evs) {
      const timeStr = new Date(ev.ts).toLocaleTimeString('zh', { hour12: false });
      if (ev.type === 'session_opened') {
        html += `<div style="color:#3a3a3a;font-size:11px;padding:4px 0">─── 会话开始 ${timeStr} ───</div>`;
      } else if (ev.type === 'message') {
        const roleLabel = ev.role === 'user' ? '用户' : '助手';
        html += `<div class="ev-msg ${ev.role}">
          <div class="ev-ts">${timeStr}</div>
          <div class="ev-role">${roleLabel}</div>
          <div class="ev-text">${_esc(ev.text)}</div>
        </div>`;
      } else if (ev.type === 'tool_call') {
        const statusIcon = ev.status === 'error' ? '<span class="ev-tool-err">✗</span>' : '<span class="ev-tool-ok">✓</span>';
        html += `<div class="ev-tool">
          <span class="ev-ts" style="flex-shrink:0">${timeStr}</span>
          <span class="ev-tool-name">${_esc(ev.tool)}</span>
          <span class="ev-tool-target">${_esc(ev.target || '')}</span>
          ${statusIcon}
        </div>`;
      }
    }

    html += '</div>';
    inspector.innerHTML = html;

    // Auto-scroll to bottom
    const scroll = document.getElementById('si-scroll');
    if (scroll) scroll.scrollTop = scroll.scrollHeight;
  }

  function _fmtAge(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const h = Math.floor(m / 60);
    if (h > 0) return `${h}h${m % 60}m`;
    if (m > 0) return `${m}m`;
    return `${s}s`;
  }

  function _esc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>

</body>
</html>
